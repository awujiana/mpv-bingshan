# === Bangumi API 配置 ===
# 官方 API 文档: https://bangumi.github.io/api/
#
# 可用的 API 服务器:
#   - 官方 API: https://api.bgm.tv
#     * 要求 User-Agent 包含联系方式（格式: 应用名/版本 (联系方式)）
#     * 限流: 每秒 1 次，每天 5000 次
#     * 数据最全最新
#   - 第三方镜像: https://api.bangumi.one
#     * 无 User-Agent 限制
#     * 无限流
#     * API 路径与官方完全兼容

# 单服务器（向后兼容，留空则使用 api_server）
# 设为 https://api.bgm.tv 可使用官方 API
api_base_url=https://api.bangumi.one

# 多服务器（逗号分隔，并发搜索，首个有效结果即取消其余）
# 支持每项使用 | 或 # 分隔备注，例如: https://api.bgm.tv|官方,https://api.bangumi.one|镜像
# 注意: 包含官方 API (api.bgm.tv) 时会自动降低并发数为 1 以避免限流
# 留空则使用 api_base_url 单服务器
# 推荐配置（官方 + 镜像冗余）:
#   api_server=https://api.bgm.tv|官方,https://api.bangumi.one|镜像
# 注意: 此项仅在首次启动时导入到 ~~/staff-credits-servers.json
#       之后以菜单中配置的优先级和启用状态为准（在 Bangumi 工具箱 → 网站优先级 中调整）
api_server=

# === 外部搜索源配置（借鉴 uosc_danmaku）===
# 是否启用外部 API 搜索源（dandanplay + 360kan + TMDB）
# 启用后会先用弹幕 API 搜索动漫名称，再用名称去 Bangumi 查询
enable_extra_search=yes
# 弹幕 API 服务器（用于搜索动漫**标准名称**，逗号分隔多服务器）
# 要求兼容 dandanplay API（需提供 /api/v2/search/episodes 端点）
#
# 【2026-10-06 实测接入】以下服务经真机验证可用（search/episodes 返回简体标准名）：
#   https://dm.wodenas.xin/xiatianembydmww
#   （huangxd-/danmu_api 系部署，token 已含在 URL 路径中，无需额外配置）
#   文档: https://github.com/huangxd-/danmu_api#api食用指南
#
# 官方源（需联网且可能较慢/受限）：
#   https://api.dandanplay.net
danmaku_api_server=https://dm.wodenas.xin/xiatianembydmww
# TMDB API Key（base64 编码，用于非中文名转中文，可空）
# 可在 https://www.themoviedb.org 注册后获取，需 base64 编码
# SEC-07 注意: base64 仅用于避免配置解析问题，不提供加密保护
# 任何能读取本文件的进程都能解码得到原始 key，请勿将含 key 的配置提交到 Git
tmdb_api_key=

# === Bangumi 用户鉴权（access token）===
# 用途：读取/写入你自己的 Bangumi 收藏与**观看进度**（标记某集为看过等）。
# 留空则相关功能整体关闭，脚本其余部分不受影响（优雅降级）。
#
# 如何获取 token：
#   1. 打开 https://next.bgm.tv/demo/access-token （Bangumi 官方 token 页面）
#   2. 登录后点击生成，复制得到的 access token
#   3. 粘贴到下面的 bangumi_token= 后面（不要加引号、不要加 Bearer 前缀）
#
# 安全提示（SEC-07 同类）：
#   token 等同于你的账号权限，任何能读取本文件的进程都能拿到。
#   请勿把填了 token 的配置提交到 Git / 分享给他人。
#
# 对应 API（已按官方 OpenAPI 规范逐条核对 open-api/v0.yaml，2026-10-06）：
#   GET   /v0/me                                        校验 token
#   GET   /v0/users/-/collections/{subject_id}          读收藏状态
#   POST  /v0/users/-/collections/{subject_id}          改收藏状态（不存在则创建）
#   PATCH /v0/users/-/collections/{subject_id}/episodes 批量更新剧集进度
#   PUT   /v0/users/-/collections/-/episodes/{ep_id}    更新单集进度
#   GET   /v0/episodes?subject_id={id}                  取剧集列表（**公开端点，无需 token**）
#
# ⚠️ 两个易错点：
#   1. episodes 只有 get/patch（没有 post）；单集只有 get/put（没有 patch）。
#      写错会拿到 405，而 curl 未加 --fail 时响应体不是 ErrorDetail，
#      会被报成「json 解析失败」—— 报错信息指向别处，极难定位。
#   2. 所有写操作成功都返回 **204 No Content（无响应体）**，只有读操作才带 JSON。
bangumi_token=

# 是否启用观看进度同步（需要上面填了 bangumi_token）
# 接受 yes/no。关闭时不会发起任何带 token 的请求
enable_progress_sync=yes

# 进度同步档位
#   off    （默认）只在手动点菜单时联网。打开视频**不产生任何网络请求**。
#   notify 打开视频后读一次收藏状态，提示「在看 · 已看 N 集」。
#   auto   notify 的基础上，播放进度达到下面的阈值后自动标记本集为看过。
#          每个视频只自动标一次。
# 建议先用 off 手动验证 token 有效，再改成 notify / auto。
progress_sync_mode=off

# auto 模式的触发阈值：播放进度超过此百分比才自动标记
# 取值范围 1-100。默认 80（看超过八成视为已看）
# 为什么要卡阈值：一打开就标记会把「点错、看 30 秒就关掉」也算成看过，
# 把收藏记录弄脏。阈值让「真的看完了」才记。
progress_sync_threshold=80

# 标记时使用的收藏类型（仅在该条目**尚未收藏**时使用）
# 注意：这是 Bangumi **新 API** 的取值，与旧版文档顺序不同！
#   1=想看  2=看过  3=在看  4=搁置  5=抛弃
# 默认 3=在看（符合"正在追番"的直觉）
collection_type_on_mark=3

# === HTTP 请求配置 ===
# 网络请求超时（秒）
# 默认 15 秒，覆盖所有 curl 子进程（api/fankuhub/dandanplay/extra/图片下载）
# 若频繁遇到 "curl exit code 28"（超时），可适当增大此值；网络通畅可调小以加快失败反馈
timeout=15
# User-Agent 头部，Bangumi 官方 API 要求含联系方式
# 格式建议: 项目名 (联系方式URL或邮箱)
# 示例: uosc_staff_credits (https://github.com/yourname/uosc_staff_credits)
user_agent=uosc_staff_credits (https://github.com/user/uosc_staff_credits)

# === SSL/TLS 配置（Windows curl exit code 35 握手失败修复）===
# 禁用证书吊销列表（CRL）检查
# Windows 上 curl 默认走 schannel，若 CRL 分发点不可达会报 exit code 35
# 禁用 revoke 检查后仍然校验证书链，安全性基本不变，建议保持 yes
# 接受 yes/no/true/false/1/0
ssl_no_revoke=yes
# 自定义 CA 证书 bundle 路径（留空使用系统默认）
# 仅在系统证书不可用时配置，例如: C:/curl-ca-bundle.crt
cacert_path=
# 跳过证书验证（仅调试用，生产环境务必保持 no）
# 接受 yes/no/true/false/1/0
insecure=no

# === 标题解析配置 ===
# 自定义标题替换规则（JSON 字符串，借鉴 uosc_danmaku/options.lua title_replace）
# 替换模式为 lua 的 string.gsub 函数，只支持 %n 捕获组写法
title_replace=[{"rules": [{"^〔(.-)〕": "%1"}, {"^.*《(.-)》": "%1"}]}]

# === 数据源选择 ===
# 角色和职员信息的数据源
#   bangumi - 使用 Bangumi API（需多次请求获取角色+职员）
#   fankuhub - 使用 fankuhub.com API（聚合 Bangumi/MAL/AniList，一次请求获取角色+职员+声优）
#   auto - 先尝试 fankuhub，失败回退到 bangumi（推荐）
# 注意: 此项仅在 servers 列表为空时使用
#       推荐在 Bangumi 工具箱 → 网站优先级 中配置数据源排序和启用状态
data_source=auto
# fankuhub API 基础 URL
fankuhub_api_base=https://fankuhub.com

# === 其他配置 ===
# 调试日志开关（仅接受 yes/no）
# 默认关闭，避免刷屏；排查问题时改为 yes
debug=no
# 搜索最大返回结果数
max_results=10
# 搜索历史缓存文件路径
history_path=~~/staff-credits-history.json
# mpv 可执行文件路径（用于图片格式转换，留空则自动检测）
# SEC-08: 默认留空，让脚本自动检测 mpv-path，避免硬编码绝对路径导致跨机器不可用
mpv_path=
# 角色图片本地缓存有效天数（缓存在 TEMP 目录的 bgra 文件）
# 超过此天数的缓存会自动重新下载，设为 0 表示永不过期
image_cache_days=30

# === uosc_danmaku 联动 ===
# 是否随 uosc_danmaku 自动静默预加载条目信息
# 打开视频时,若 uosc_danmaku 加载了弹幕,自动后台查询 Bangumi 条目 ID 并缓存
# 用户后续打开 Bangumi 工具箱时,缓存命中直接显示,无需等待搜索
autoload_with_danmaku=yes

# === 本地持久化数据缓存 (v1.7) ===
# 数据缓存有效天数（缓存 API 响应数据到 ~~/staff-credits-data-cache.json）
# 超过此天数的缓存会自动重新拉取，设为 0 表示永不过期
# 接受 0/1/3/7/15/30 等正整数
data_cache_days=30
# 是否启用本地数据缓存（接受 yes/no）
enable_data_cache=yes
# 静默预加载深度（打开视频时后台预取的数据范围）
#   subject   - 仅预取条目 ID（最省流量）
#   characters - 预取条目 + 角色列表
#   persons   - 预取条目 + 角色 + 职员（推荐）
#   all       - 预取条目 + 角色 + 职员 + 详情（最完整，流量最大）
silent_preload_depth=all
# 翻页按钮位置（职员表/角色介绍面板）
#   top    - 按钮位于网格顶部上方
#   middle - 按钮位于网格中间右侧
#   bottom - 按钮位于底部提示栏上方（默认，避开 uosc 控制条）
pagination_position=bottom
