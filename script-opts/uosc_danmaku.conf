## 指定弹幕服务器地址，自定义服务需兼容 dandanplay 的 api
## 可指定多个用英文逗号分隔的有序 api_server 列表
## 支持每项使用 '|' 或 '#' 分隔备注，例如: "https://a.example.com|备用A" 或 "https://b.example.com#备用B"
##
## ============================================================================
## 【2026-10-06 实测接入 LogVar / danmu_api 类弹幕服务】
## ============================================================================
## 这类服务（huangxd-/danmu_api 及其衍生部署）的鉴权 token **直接写在 URL
## 路径里**，不是 HTTP 头。官方文档原文：
##     「使用 http://{ip}:9321/{TOKEN} 访问上述 API 接口。」
##     「注意：TOKEN 为默认 87654321 的情况下，可不带 {TOKEN} 请求。」
## 参考文档：https://github.com/huangxd-/danmu_api#api食用指南
##
## ⇒ 因此**整串（含 token 路径）直接填进 api_server 即可**，脚本会自动在
##   后面拼 /api/v2/search/anime 等端点，无需改动任何脚本文件。
##
## 填写要点：
##   1. 不要带结尾斜杠（脚本自己会加），带上也能容错但没必要
##   2. 不要写 /api/v2（脚本自动拼）
##   3. token 就是域名后那一段路径，必须原样保留
##
## 已实测可用的服务：
##   · https://dm.wodenas.xin/xiatianembydmww   ← token 已含在路径中，直接可用
##     （实测 search/anime、bangumi、comment 三个端点全部 200，能正常出弹幕）
## 注：另一候选 https://dm.ljiaovm.com 为同款服务，但启用了自定义 token，
##     无 token / 默认 token 87654321 均返回 401 Unauthorized，
##     且其上游当前不可达（502），故**不采用**，此处不再保留条目。
##
api_server=https://dm.wodenas.xin/xiatianembydmww|LogVar弹幕API(夏日)
## 原始默认服务器（保留备查，需要时把上面 api_server 换成它）
#api_server=https://danmaku-api.152468.xyz
## 指定 b 站和爱腾优的弹幕获取的兜底服务器地址，主要用于获取非动画弹幕
## 可用： https://api.danmu.icu，https://dmku.hls.one
#fallback_server=https://api.danmu.icu
## 设置 tmdb 的 API Key，用于获取非动画条目的中文信息(当搜索内容非中文时)
## 可以在 https://www.themoviedb.org 注册后去个人账号设置界面获取
## 注意：自定义此参数时还需要对获取到的 API Key 进行 base64 编码
#tmdb_api_key=NmJmYjIxOTZkNzIyN2UyMTIzMGM3Y2YzZjQ4MDNkZGM=
## 自动加载网络弹幕
auto_load=yes
## 自动加载本地弹幕
autoload_local_danmaku=yes
## 为 URL 串流播放场景自动加载弹幕
autoload_for_url=yes
## 自动保存网络弹幕到本地（视频同目录下同名 xml 文件）
save_danmaku=no
## 启用 fps 视频滤镜让弹幕滚动更平滑
##! 性能消耗较大
vf_fps=yes
## 设置要使用的 fps 滤镜参数
#fps=60/1.001
## 指定合并重复弹幕的时间间隔的容差值，单位为秒。默认值：-1，表示禁用
merge_tolerance=-1
## 合并重复弹幕时是否忽略类型和颜色差异。默认值：no
#merge_without_style=yes
## 限制同屏显示的最大弹幕数量，默认值 0 表示不限制
max_screen_danmaku=0
## 指定弹幕关联历史记录文件的路径，支持绝对路径和相对路径
history_path=~~/files/danmaku-history.json

## 中文简繁转换。0-不转换，1-转换为简体，2-转换为繁体
chConvert=0
## 滚动弹幕的显示时间。这会左右滚动速度
scrolltime=16
## 固定弹幕的显示时间
fixtime=8
## 字体
fontname=sans-serif
## 字体大小 
fontsize=30
## 透明度
opacity=0.5
## 粗体
bold=yes
## 描边 0-4
outline=1
## 阴影
shadow=0
## 全部弹幕的显示范围（0.0-1.0）
displayarea=0.2
#弹幕密度 整数(>=-1) -1：表示不重叠 0：表示无限制 其他表示限定条数
density=-1

## 指定弹幕屏蔽词文件路径（black.txt），支持绝对路径和相对路径。文件内容以换行分隔
## 支持 lua 的正则表达式写法
#blacklist_path=
## 自定义标题解析中的额外替换规则，内容格式为 JSON 字符串，替换模式为 lua 的 string.gsub 函数
##! 注意：由于 mpv 的 lua 版本限制，自定义规则只支持形如 %n 的捕获组写法，即示例用法，不支持直接替换字符的写法 
title_replace=[{"rules":[{ "^〔(.-)〕": "%1"},{ "^.*《(.-)》": "%1" }]}]
## 指定哈希匹配中需忽略的共享盘（挂载盘）的路径/目录。支持绝对路径和相对路径，多个路径用逗号分隔
## 示例：["X:", "Z:", "F:/Download/", "Download"]
#excluded_path=