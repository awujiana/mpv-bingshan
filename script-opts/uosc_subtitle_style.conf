# uosc_subtitle_style.lua —— 内封字幕样式快速切换（uosc 菜单，主/次字幕分轨）
# 菜单顶部切换「编辑目标」（主字幕/次字幕），位置/缩放/字体/字号只对目标轨生效；
# 位置档位（本机实测标定）：原位100 / 中下75 / 中部50 / 中上25 / 顶部5。
#
# ⚠ 写法约束（2026-10-22 真机踩坑）：mpv 的 conf 解析器**不支持行尾注释**——
#   `preset_enabled=yes  # 注释` 会把「yes  # 注释」整段当值：
#   布尔/数值项直接报转换 Error 并回落到脚本默认值（恰好等于期望值时会被掩盖），
#   字符串项则静默把注释吃进值里。**注释一律写在独立行**。

# 是否把当前预设写入 ~~/uosc-subtitle-style-state.json，
# 以便重启与切换文件后自动恢复（mpv.conf 的 reset-on-next-file 会重置 sub-pos/sub-scale，
# 因此无论是否持久化，脚本都会在每个文件加载后重新应用当前预设）。
# 注意：sub-ass-style-overrides 列表不随文件重置，脚本启动时会先写一次，
# 保证字幕轨初始化时就能拿到字体/粗体覆盖。
persist=yes

# 预设的默认基准（= mpv 原生默认值）；「恢复默认」也回到这些值。
# 注意：mpv 对次字幕的原生默认是「顶部」(0)，与主字幕的「底部」(100) 不同，
# 两轨因此天然不重叠。脚本启动时优先读取 mpv 当前值，这里的默认值仅在读不到时兜底。
pos_default=100
sec_pos_default=0
scale_default=1

# 菜单里「上移/下移」微调的步长，单位 % 屏幕高度（sub-pos 单位）
nudge=5

# 两轨位置避让的最小间距（% 屏幕高度；实测一档 ≈ 84px）。
# 目标轨设新位置时，另一轨自动让到最近的不重叠位置（避让范围 0-100）；
# 加载/复位时同样保证。调大可让双语字幕离得更远。
pos_min_gap=25

# 未检测到 uosc 时，open-menu 是否降级为循环切换 + OSD 文本列表
fallback_cycle=yes

# 字体候选（菜单「字体」区），逗号分隔。
# 说明：ASS 字幕通过 sub-ass-style-overrides 的 FontName= 覆盖（改后需 sub-reload，
# 脚本会自动执行）；文本文本字幕走 sub-font 属性。字体名需与系统/fontconfig 中的
# 族名一致，否则 libass 会回退到默认字体。
fonts=Noto Sans CJK SC,Noto Serif CJK SC,Noto Sans CJK KR,Noto Serif CJK KR

# 字号候选（菜单「字号」区），单位是 **720p 等效像素**（与 mpv --sub-font-size 同语义）。
# 两种写法：'标签=数值,标签=数值'（推荐）或裸数值 '32,38,46'（按序号自动取名）。
# 说明：ASS 字幕只有 sub-ass-override=force 才能把 sub-font-size 施加进去
# （mpv 会按脚本 PlayResY 正确换算），因此选择字号预设时脚本会自动切到 force，
# 对白幕将按 --sub-* 配色渲染；带 \pos 的 signs/特效幕不受影响。选「原样」即恢复。
sizes=小=32,标准=38,大=46,特大=56

# 描边粗细候选（sub-outline-size；标签=数值 或裸数值）。
# 0 表示无描边。描边走 force 通道，只对目标轨生效（对白幕同时按 sub-* 配色）。
outlines=无=0,细=0.5,标准=1,粗=2,特粗=3

# 描边颜色候选（sub-outline-color；标签=#RRGGBB，可带 AA 透明度前缀）。
outline_colors=黑=#000000,白=#FFFFFF,红=#FF0000,黄=#FFFF00,绿=#00FF00,青=#00FFFF,蓝=#0000FF,灰=#808080

# 主颜色候选（sub-color；标签=#RRGGBB）。主颜色走 force 的 COLORS 位，只对目标轨生效。
colors=白=#FFFFFF,黄=#FFFF00,淡黄=#FFFFC8,青=#00FFFF,淡蓝=#C8E6FF,粉=#FFC8DC,绿=#90EE90,橙=#FFA500

# ---- 载入时的样式检测与预设样式 ----

# 判定「彩色字幕」的最小饱和度：主色 max-min(RGB) ≥ 该值即视为彩色。
# 白/灰/黑（饱和度为 0）不算彩色；阈值 40 时 #272700（39）不彩色、#282800（40）彩色。
colored_threshold=40

# 内封字幕像素采样：白字+彩色描边时，那个「非主色的高饱和色」像素占比下限。
# 彩色描边是细线，占比常常不到 2%（实测粉描边 #ED74CF 仅 ~0.87%），所以对它单独用
# 这个更低的比例阈值（0.005 = 0.5%）；主色/暗描边本身饱和则不受此限、直接判彩色。
# 调大可减少误判（把零星抗锯齿高饱和像素当描边），调小更灵敏（更细的彩描边也转黑白）。
colored_outline_min=0.005

# 载入后等待多久做样式检测（秒）。等待是为了让字幕先渲染出来（像素采样需要）。
inspect_delay=1.2

# 左上角检测报告的显示时长（毫秒）。报告临时把 osd-align 切到左上角，结束后自动还原。
report_ms=6000

# 检测重试次数：字幕未及时加载 / 片头长时间无对白时，等第一句对白出现再检。
# 第一句对白出现（sub-text 由空转非空）会即时触发检测；这里是兜底重试的次数上限。
inspect_retries=15

# 检测重试间隔（秒）
inspect_retry_delay=1.0

# 进/出 force 覆盖时，属性值与重建之间的延迟（秒）。
# 同一 tick 内「设属性 + 触发解码器重建」会读到旧值，故先切换 override、
# 延迟这一点时间再写终值。一般不用改。
rebuild_delay=0.12

# ---- 中日双语（双轨）自动布局 ----

# 载入时若主/次字幕轨按语言识别为一中一日，自动布局：日文轨置底并缩小、中文轨在其上，
# 两轨用上面的避让间距(pos_min_gap)分开。语言识别双路：内封轨读 track-list 的 lang；
# 外挂轨 mpv 不给 lang，改从文件名语言标记猜（.jpn./.chi./.sc./(JP)/(CHS) 等）。
# 布局是 per-file 覆盖层：不写状态文件、不跨文件泄漏；用户手动调位置/缩放即关闭本次布局。
# 带 \pos 的注释幕(signs)对位置与缩放都豁免，样式/位置不受影响（真机实测）。
# 改为 no 则双语轨保持 mpv 原样（主底/次顶）。
dual_layout=yes

# 双语布局中日文轨的缩放倍率（sub-scale/secondary-sub-scale；视觉上日文小于中文）
dual_layout_scale=0.8

# 预设样式：载入时检测到（彩色）字幕后自动套用的目标样式。
# 可随时用菜单「把当前样式存为预设」修改，缓存于 ~~/uosc-subtitle-style-preset.json（重启仍生效）；
# 「恢复出厂预设」回到下面这些值。

# 载入时自动套用总开关（关掉后只报告不修改）
preset_enabled=yes

# 仅当字幕本身是彩色时才套用（白字字幕保持原样）
preset_only_colored=yes

# 双语字幕（同时存在次字幕轨）时保持原样、不改颜色：
# 两条轨往往已各有配色，强行统一会破坏双语可读性。
# 改为 no 则双语也套用；菜单里也可临时切换（「双语字幕保持原样」开关）。
preset_skip_dual=yes

# 预设主色（sub-color，#RRGGBB）
preset_color=#FFFFFF

# 预设描边色（sub-outline-color，#RRGGBB）
preset_outline_color=#000000

# 预设描边粗细（sub-outline-size）
preset_outline=2

# 预设字体族名；空 = 不指定（用字幕自带）
preset_font=

# 预设字号（720p 等效像素）；0 = 不指定
preset_size=0

# 预设粗体：keep=不覆盖 / on=加粗 / off=常规
preset_bold=keep
