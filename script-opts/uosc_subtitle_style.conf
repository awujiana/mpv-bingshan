# uosc_subtitle_style.lua —— 内封字幕样式快速切换（uosc 菜单，主/次字幕分轨）
# 菜单顶部切换「编辑目标」（主字幕/次字幕），位置/缩放/字体/字号只对目标轨生效；
# 位置档位（本机实测标定）：原位100 / 中下75 / 中部50 / 中上25 / 顶部5。
#
# ⚠ 写法约束（2026-10-22 真机踩坑）：mpv 的 conf 解析器**不支持行尾注释**——
#   `preset_enabled=yes  # 注释` 会把「yes  # 注释」整段当值：
#   布尔/数值项直接报转换 Error 并回落到脚本默认值（恰好等于期望值时会被掩盖），
#   字符串项则静默把注释吃进值里。**注释一律写在独立行**。

# 是否把当前预设写入 ~~/uosc-subtitle-style-state.json，
# 以便重启与切换文件后自动恢复（mpv.conf 的 reset-on-next-file 会重置 sub-pos/sub-scale，
# 因此无论是否持久化，脚本都会在每个文件加载后重新应用当前预设）。
# 注意：sub-ass-style-overrides 列表不随文件重置，脚本启动时会先写一次，
# 保证字幕轨初始化时就能拿到字体/粗体覆盖。
persist=yes

# 预设的默认基准（= mpv 原生默认值）；「恢复默认」也回到这些值。
# 注意：mpv 对次字幕的原生默认是「顶部」(0)，与主字幕的「底部」(100) 不同，
# 两轨因此天然不重叠。脚本启动时优先读取 mpv 当前值，这里的默认值仅在读不到时兜底。
pos_default=100
sec_pos_default=0
scale_default=1

# 菜单里「上移/下移」微调的步长，单位 % 屏幕高度（sub-pos 单位）
# v1.0.11：由 5 改为 1，便于把 \pos 内封字幕一点点推进黑边。
nudge=1

# 两轨位置避让的最小间距（% 屏幕高度；实测一档 ≈ 84px）。
# 目标轨设新位置时，另一轨自动让到最近的不重叠位置（避让范围 0-100）；
# 加载/复位时同样保证。调大可让双语字幕离得更远。
pos_min_gap=25

# 未检测到 uosc 时，open-menu 是否降级为循环切换 + OSD 文本列表
fallback_cycle=yes

# 字体候选（菜单「字体」区），逗号分隔。
# 说明：ASS 的 \pos 定位字幕走 sub-ass-style-overrides 的 FontName=（改写样式表，
# 列表变化会触发一次重建）；普通对白走 force + sub-font；文本字幕走 sub-font 属性。
# 字体名需与系统/fontconfig 中的族名一致，否则 libass 会回退到默认字体。
# ⚠ 绝不能用 sub-reload 推动重建：本机实测它会让内封字幕播放直接结束。
fonts=Noto Sans CJK SC,Noto Serif CJK SC,Noto Sans CJK KR,Noto Serif CJK KR

# 字号候选（菜单「字号」区），单位是 **720p 等效像素**（与 mpv --sub-font-size 同语义）。
# 两种写法：'标签=数值,标签=数值'（推荐）或裸数值 '32,38,46'（按序号自动取名）。
# 说明：ASS 字幕只有 sub-ass-override=force 才能把 sub-font-size 施加进去
# （mpv 会按脚本 PlayResY 正确换算），因此选择字号预设时脚本会自动切到 force，
# 对白幕将按 --sub-* 配色渲染；带 \pos 的 signs/特效幕不受影响。选「原样」即恢复。
sizes=小=32,标准=38,大=46,特大=56

# 描边粗细候选（sub-outline-size；标签=数值 或裸数值）。
# 0 表示无描边。描边走 force 通道，只对目标轨生效（对白幕同时按 sub-* 配色）。
outlines=无=0,细=0.5,标准=1,粗=2,特粗=3

# 描边颜色候选（sub-outline-color；标签=#RRGGBB，可带 AA 透明度前缀）。
outline_colors=黑=#000000,白=#FFFFFF,红=#FF0000,黄=#FFFF00,绿=#00FF00,青=#00FFFF,蓝=#0000FF,灰=#808080

# 主颜色候选（sub-color；标签=#RRGGBB）。
# 主色同时写 force 的 COLORS 位和 sub-ass-style-overrides 的 PrimaryColour，
# 因此带 \pos 的顶部字幕/signs 也会变色（见脚本文件头说明）。
# 黑色用于浅色画面；灰阶用于对比/还原被自动识别成「非标准黑白」的灰色字幕。
colors=白=#FFFFFF,黑=#000000,深灰=#404040,灰=#808080,浅灰=#C0C0C0,黄=#FFFF00,淡黄=#FFFFC8,青=#00FFFF,淡蓝=#C8E6FF,粉=#FFC8DC,绿=#90EE90,橙=#FFA500

# ---- 载入时的样式检测与预设样式 ----

# 判定「彩色字幕」的最小饱和度：主色 max-min(RGB) ≥ 该值即视为彩色。
# 白/灰/黑（饱和度为 0）不算彩色；阈值 40 时 #272700（39）不彩色、#282800（40）彩色。
colored_threshold=40

# 内封字幕像素采样：白字+彩色描边时，那个「非主色的高饱和色」像素占比下限。
# 彩色描边是细线，占比常常不到 2%（实测粉描边 #ED74CF 仅 ~0.87%），所以对它单独用
# 这个更低的比例阈值（0.005 = 0.5%）；主色/暗描边本身饱和则不受此限、直接判彩色。
# 调大可减少误判（把零星抗锯齿高饱和像素当描边），调小更灵敏（更细的彩描边也转黑白）。
colored_outline_min=0.005

# 载入后等待多久做样式检测（秒）。等待是为了让字幕先渲染出来（像素采样需要）。
inspect_delay=1.2

# 左上角检测报告的显示时长（毫秒）。报告临时把 osd-align 切到左上角，结束后自动还原。
report_ms=6000

# v1.0.11 左上角 OSD 消息总开关。设为 no 可完全关闭左上角输出：
#   * 不再弹「内封字幕(像素采样)… / 已套用预设样式… / 内封字幕轨…」检测报告；
#   * 不再弹「预设已保存并缓存」等左上角提示；
#   * 完全不改动 osd-align-x / osd-align-y，避免临时改对齐影响别的 OSD。
# ⚠ 只是「不显示」：样式检测、灰色/彩色识别、自动黑白预设、全内封轨检查、
#   上下黑边贴合、位置/字号通道全部照常执行，功能一点不少。
# 菜单里也有「显示左上角检测报告」可临时开关（不落盘，重启回到本文件的值）。
# 外部脚本可用 script-message-to uosc_subtitle_style report-toggle 切换。
show_report=yes

# v1.0.14：保持原样（未套用预设：标准白字黑边 / 双语不改色 / 灰度识别关闭等）
# 时，是否仍弹左上角 OSD。常用片源多为标准白字黑边，每次切轨都刷「保持原样」很干扰
# 观看，故默认 no（静音）；设为 yes 才恢复显示。注意：这只在「一切照旧」时静音，
# 套用了预设（「已套用预设样式」）仍照常显示；且与上方 show_report 是「与」关系
# （show_report=no 会彻底关闭所有左上角输出）。
show_keep_original=no

# 检测重试次数：字幕未及时加载 / 片头长时间无对白时，等第一句对白出现再检。
# 第一句对白出现（sub-text 由空转非空）会即时触发检测；这里是兜底重试的次数上限。
inspect_retries=15

# 检测重试间隔（秒）
inspect_retry_delay=1.0

# 进/出 force 覆盖时，属性值与重建之间的延迟（秒）。
# 同一 tick 内「设属性 + 触发解码器重建」会读到旧值，故先切换 override、
# 延迟这一点时间再写终值。一般不用改。
rebuild_delay=0.12

# ---- 中日双语（双轨）自动布局 ----

# 载入时若主/次字幕轨按语言识别为一中一日，自动布局：日文轨置底并缩小、中文轨在其上，
# 两轨用上面的避让间距(pos_min_gap)分开。语言识别双路：内封轨读 track-list 的 lang；
# 外挂轨 mpv 不给 lang，改从文件名语言标记猜（.jpn./.chi./.sc./(JP)/(CHS) 等）。
# 布局是 per-file 覆盖层：不写状态文件、不跨文件泄漏；用户手动调位置/缩放即关闭本次布局。
# 带 \pos 的注释幕(signs)对位置与缩放都豁免，样式/位置不受影响（真机实测）。
# 改为 no 则双语轨保持 mpv 原样（主底/次顶）。
dual_layout=yes

# 双语布局中日文轨的缩放倍率（sub-scale/secondary-sub-scale；视觉上日文小于中文）
dual_layout_scale=0.8

# 预设样式：载入时检测到（彩色）字幕后自动套用的目标样式。
# 可随时用菜单「把当前样式存为预设」修改，缓存于 ~~/uosc-subtitle-style-preset.json（重启仍生效）；
# 「恢复出厂预设」回到下面这些值。

# 载入时自动套用总开关（关掉后只报告不修改）
preset_enabled=yes

# 仅当字幕本身是彩色时才套用（白字字幕保持原样）
preset_only_colored=yes

# 双语字幕（同时存在次字幕轨）时保持原样、不改颜色：
# 两条轨往往已各有配色，强行统一会破坏双语可读性。
# 改为 no 则双语也套用；菜单里也可临时切换（「双语字幕保持原样」开关）。
preset_skip_dual=yes

# 预设主色（sub-color，#RRGGBB）
preset_color=#FFFFFF

# 预设描边色（sub-outline-color，#RRGGBB）
preset_outline_color=#000000

# 预设描边粗细（sub-outline-size）
preset_outline=2

# 预设字体族名；空 = 不指定（用字幕自带）
preset_font=

# 预设字号（720p 等效像素）；0 = 不指定
preset_size=0

# 预设粗体：keep=不覆盖 / on=加粗 / off=常规
preset_bold=keep

# ---- v1.0.6：定位字幕(\pos)覆盖 与 灰色字幕识别 ----

# 把主色/描边色/字体同步写进 sub-ass-style-overrides，改写 ASS 样式表本身。
# mpv 的 force 选择性覆盖对带 \pos 的 explicit 事件豁免，Netflix 等内封 ASS 每行都带
# \pos，实测改字体/主色完全无反应；走样式表才能让顶部字幕/signs 一并生效。
# 代价：该列表是解码器级共享（主/次字幕轨同变），且改动会触发一次解码器重建。
# 改为 no 则退回纯 force 通道：只改普通对白，但保留主/次分轨能力。
style_override_all=yes

# 灰色字幕（如 #8B8B8B，饱和度为 0 但既不是白也不是黑）也视为「非标准黑白」，
# 载入时自动套用预设的白字黑边样式。改为 no 则只有彩色字幕才套用。
preset_include_gray=yes

# ---- v1.0.7：上下黑边内显示字幕 ----

# 视频文件内嵌上下黑条时（如 3840x2160 上下各 120px），把主字幕放进下黑条、
# 次字幕放进上黑条，不遮挡画面内容。脚本逐行扫描视频帧亮度测出黑条厚度，
# 按 sub-font-size 估算字幕盒高度，限缩 sub-scale 并用 sub-margin-y 居中。
# ⚠ 带 \pos 的 explicit ASS 事件对 sub-pos/sub-scale 豁免（mpv 硬边界）。
#   v1.0.11 起，ass_pos_shift=yes 时改由 PlayResY 覆盖把 \pos 对白送进下黑边
#   （见文末 v1.0.11 段）；关掉位移通道才回到「保持原位」。
#   播放窗口/全屏 letterbox 产生的黑边由 mpv 原生 sub-use-margins 处理，不归本项管。
# 用户手动调位置/缩放即让位；关闭时自动还原 sub-margin-y。
letterbox_fit=yes

# 黑条至少占帧高百分之多少才启用（防止把暗场/淡入淡出误判成黑边）
letterbox_min_bar=0.03

# 判定「黑」的行平均亮度阈值（0-255，越低越严格）
letterbox_dark_luma=20

# 字幕盒相对黑条高度保留的余量比例，避免贴死黑条边缘
letterbox_pad=0.10

# 逐行扫描时的列采样步长（像素）；4K 下越大越快，8 已足够稳定
letterbox_sample_step=8

# 首检延迟（秒，叠加在 inspect_delay 之后），等首帧与字幕渲染稳定
letterbox_delay=0.6

# ---- v1.0.8：所有的内封字幕都要被检查 ----

# 旧检测只看当前选中的一条字幕轨，而且一个文件成功检测一次后就不再重检；
# 一个 MKV 里的简体/繁体/英文/注释 signs 等其它内封轨切换过去时完全没被检查过。
# 开启后：报告列出「内封字幕轨：共 N 条，已检查 M 条（待检查 …）」，
# 切换 sid/secondary-sid 到尚未检查的内封轨时自动重新检测并按规则套用样式。
inspect_all_internal=yes

# 旧套用判据只认「彩色 / 灰阶」，任何没落进这两个窄区间的内封配色都会被判
# 「非彩色字幕，保持原样」（用户截图：主色 #8B8B8B 的灰色内封字幕没转黑白）。
# 开启后：内封字幕除「标准白字黑边」（主色近纯白 + 描边近纯黑）外一律套用
# 黑白预设，不再依赖单一颜色判据；外挂字幕仍按彩色/灰阶判据，保留其原有配色。
preset_all_internal=yes

# ---- v1.0.9：内封定位字幕的缩放 / 字号 / 黑边自动缩小 ----

# 带 \pos 的 explicit ASS 事件（Netflix 等内封字幕几乎每行都有）对
# sub-pos / sub-scale / sub-font-size 完全豁免，只有改写 ASS 样式表的
# Fontsize 才生效。开启后：从 sub-ass-extradata 读出原始 Style 行的
# Fontsize 与 PlayResY，把「字号倍率 × 有效缩放」折成新 Fontsize 写回，
# 同时把两轨 sub-scale 归 1，避免普通对白被双叠加放大。
# 字体仍沿用用户的字体设置；缩放/字号在此模式下是共享通道（主/次轨同变）。
ass_fontsize=yes

# 防御性兜底比例：ass_style_info() 意外返回 nil 时，
# 720p 等效像素 → ASS 脚本单位的换算（实测 32px 约合 18 单位）。
# 正常路径直接从 sub-ass-extradata 的 Style 行读原始 Fontsize，不用这个比例。
ass_fontsize_ratio=0.5625

# 兜底基准像素：只有连 mpv 的 sub-font-size 都读不到时才会用到。
# 点「字号 ±1px」实际从「当前字号 → mpv 基线字号 → 本值」依次取起点，
# 保证第一次点击是相对当前字号 +1，而不是跳到 33px 反而变小。
size_baseline=32

# 菜单「字号 −/+」每次增减的像素值。Fontsize 支持小数，逐次点击都会生效。
size_step=1

# 字号微调的上下限（720p 等效像素）
size_min=12
size_max=96

# 黑边贴合把字幕自动缩小后，用户点「字号 +1px」放大时，
# 顺手把这个字号写进全局预设缓存；下次载入预设会还回用户调好的大小。
# 改为 no 则需手动点「把当前样式存为预设」。
size_step_saves_preset=yes

# v1.0.11「内封定位字幕可下移」：真机逐通道实测，带 \pos 的 explicit ASS 事件
# 对 sub-pos / sub-scale / sub-font-size 全部豁免，而且 sub-margin-y 在 ASS 下
# 也是死通道（22→100 像素一字不差）—— 这正是「字幕没进黑边 / 点下移没反应」
# 的根因。唯一能改 Y 的是覆盖 ASS Script Info 的 PlayResY：
#   y_render = y_ass × 帧高 / PlayResY，缩小 PlayResY ⇒ 所有 \pos 的 Y 按
#   同一比例放大（底部对白位移大、顶部 signs 位移小）；字体同时放大，脚本会
#   把 Fontsize 除以同一比例补回，物理字号不变。
# 开启后「上移/下移 1%」与「上下黑边贴合」都会同步作用于 \pos 字幕，
# 定位与 ASS 特效全部保留；关掉则回到 v1.0.10 的「保持原位」。
# ⚠ 不要改用 sub-ass-override=strip：实测会删掉 \pos 让顶部注释与对白重叠，
#   并使 sub-ass-style-overrides 整个失效，黑白预设与字号通道都会崩。
ass_pos_shift=yes

# 未施加 PlayResY 覆盖时，\pos 对白锚点（盒底）相对帧高的比例。
# 示例 MKV 2160p 实测盒底 y2038 ⇒ 0.943；流媒体 ASS 通常在 0.92~0.96。
# 仅用于把「±1% 屏幕高度」换算成 PlayResY 比例与反解黑边目标锚点，
# 有偏差时可用 1% 微调自行校准，不影响其它计算。
ass_anchor_ratio=0.94
