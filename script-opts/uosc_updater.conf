# uosc_updater.conf —— uosc 系列脚本的 GitHub 自更新驱动配置
# 生效方式：重启 mpv。修改后也可以发 script-message uosc-updater-check 立即检查。
#
# 注意：mpv 的 conf **不支持行尾注释**，注释必须独立成行，
# 否则「值 + 注释」会被整段当成配置值（布尔/数值项会报 error converting value）。
#
# 更新落盘后**下次启动 mpv 生效**：mpv 没有卸载/热重载脚本的能力，
# 本脚本不会在运行时替换自己。
#
# 更新**不保留 .bak 备份**，也不留任何临时文件（内部的中转文件用完即删）。
# 如果你本地手工改过这两个脚本，自动更新会把它换回官方版本——
# 需要保留改动就把 update_subtitle_style / update_staff_credits 设为 no。

# 总开关。no 时既不检查也不更新，手动命令也一并失效。
enabled=yes

# 启动后延迟多少秒开始首次检查。默认 30 秒，避开开播时的高负载。
startup_delay=30

# 周期检查间隔（小时）。0 表示只在启动时检查一次。
interval_hours=6

# 真正安装更新后是否弹一条 OSD 提示（内容形如「已更新 v1.0.5 → v1.0.6」）。
# 检查结果本身只写日志，不会打扰观看。
notify=yes

# 是否管理 uosc_subtitle_style（单文件脚本，跟 GitHub Release 最新资产）。
update_subtitle_style=yes

# 是否管理 uosc_staff_credits（scripts/uosc_staff_credits 这个 git 工作副本）。
# 只做快进更新；工作区有未提交改动或本地有额外提交时自动跳过。
update_staff_credits=yes

# git 可执行文件。不在 PATH 里就填绝对路径。
git_path=git

# GitHub API 根地址。留空或保持默认即可；
# 若 api.github.com 在本地不可达，可指向自建/镜像的兼容 API。
api_base=https://api.github.com
